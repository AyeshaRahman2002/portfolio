<!doctype html>
<html lang="en">
  <head><meta charset="utf-8"><title>Form detection</title></head>
  <body>
    <!-- Static Netlify form definition. The visible accessible form lives at /contact. -->
    <form name="contact" data-netlify="true" data-netlify-honeypot="company" hidden>
      <input type="text" name="name">
      <input type="email" name="email">
      <select name="type"><option>Engineering</option><option>Research</option><option>Art / Commission</option><option>Other</option></select>
      <textarea name="message"></textarea>
      <input type="text" name="company">
    </form>
  </body>
</html>
